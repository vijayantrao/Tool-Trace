# Full local stack:  docker compose up --build   ->  open http://localhost:3000
# Credentials here are for local use only and never reach production.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tooltrace
      POSTGRES_PASSWORD: tooltrace_local_only
      POSTGRES_DB: tooltrace
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tooltrace -d tooltrace"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://tooltrace:tooltrace_local_only@db:5432/tooltrace
      APP_URL: http://localhost:3000
      RP_ID: localhost
      RP_ORIGINS: http://localhost:3000
      COOKIE_SECURE: "false"
      # Smart stations. This master key is for local use only: generate your own for anything real.
      STATION_MASTER_KEY: "6c6f63616c2d6f6e6c792d6d61737465722d6b65792d646f2d6e6f742d757365"
      MQTT_URL: mqtt://mqtt:1883
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      mqtt:
        condition: service_started

  mqtt:
    # Local broker for stations and the terminal simulator. Anonymous access: local only.
    image: eclipse-mosquitto:2
    command: mosquitto -c /mosquitto-no-auth.conf
    ports:
      - "1883:1883"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      API_URL: http://api:8080
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:

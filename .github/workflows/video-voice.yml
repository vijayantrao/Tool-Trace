# Temporary: builds the 5-minute video's voice-over. Lives only on the video-voice branch.
name: Video voice
on:
  push:
    branches: [video-voice]
    paths: ['video-voice/script.json', 'video-voice/tts.py', '.github/workflows/video-voice.yml']
permissions:
  contents: write
jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -q edge-tts==7.3.1 faster-whisper==1.2.1
      - run: set -o pipefail; python video-voice/tts.py 2>&1 | tee video-voice/log.txt
      - name: Save the audio on this branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A video-voice
          git commit -m "Video voice-over (generated)"
          git push

name: Demo reset

# The public demo is wiped and reloaded every night: fictional tools and personas,
# a year of synthetic history, and a fresh model run. Needs the repository secret
# DEMO_DATABASE_URL. The reset refuses to touch a database that holds real accounts.

on:
  schedule:
    - cron: '31 20 * * *' # 02:01 in India (IST)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demo-reset
  cancel-in-progress: false

jobs:
  reset:
    name: Wipe and reload the demo
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DEMO_DATABASE_URL }}
    steps:
      - name: Check configuration
        id: config
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::notice title=Demo reset::DEMO_DATABASE_URL is not set. Skipping."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.config.outputs.configured == 'true'
      - uses: actions/setup-node@v6
        if: steps.config.outputs.configured == 'true'
        with:
          node-version: 22
          cache: npm
      - if: steps.config.outputs.configured == 'true'
        run: npm ci --workspace apps/api --include-workspace-root
      - name: Wipe and load demo data and personas
        if: steps.config.outputs.configured == 'true'
        run: scripts/ci/run.sh "Demo reset" npm run demo:reset -w apps/api
      - uses: actions/setup-python@v5
        if: steps.config.outputs.configured == 'true'
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - if: steps.config.outputs.configured == 'true'
        run: pip install -r ml/requirements.txt
      - name: Synthetic history and a model run
        if: steps.config.outputs.configured == 'true'
        working-directory: ml
        run: |
          ../scripts/ci/run.sh "Demo history" python -m tooltrace_ml seed-history --open
          ../scripts/ci/run.sh "Demo model run" python -m tooltrace_ml run

name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI can read the code and nothing else.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API - typecheck, test, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
      # Also runs the shared-rate-limit tests against a real Redis.
      REDIS_TEST_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: Web - browser tests with real passkeys
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      E2E_DATABASE_URL: postgres://postgres:postgres@localhost:5432/tooltrace_e2e
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: apps/web/test-results
          retention-days: 7

  firmware:
    name: Firmware - C++ tests and ESP32 build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware/station
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get install -y --no-install-recommends libssl-dev
      - name: Host tests (shared signing vectors)
        run: make -C test/host
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/station/platformio.ini') }}
      - run: pip install platformio
      - run: cp include/config.example.h include/config.h
      - name: Build ESP32 firmware
        run: pio run

  docker:
    name: Docker images - build and CVE scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -f apps/api/Dockerfile -t tooltrace-api:ci .
      - run: docker build -f apps/web/Dockerfile -t tooltrace-web:ci .
      - name: Install Grype (pinned, checksum-verified)
        run: |
          curl -sSfL -o grype.tgz https://github.com/anchore/grype/releases/download/v0.92.2/grype_0.92.2_linux_amd64.tar.gz
          echo "0b378a8d4153aa71d9ce95a3597f241a90f98b957a5694041d0ec04c6600b115  grype.tgz" | sha256sum -c -
          tar xzf grype.tgz -C "$RUNNER_TEMP" grype
      # Findings become annotations and a job summary. Fails only on critical
      # vulnerabilities that already have a fix (so there is something to do about it).
      - name: Scan API image
        run: |
          "$RUNNER_TEMP/grype" tooltrace-api:ci --only-fixed -o json --file grype-api.json
          node scripts/ci/grype-report.mjs grype-api.json "API image"
      - name: Scan web image
        if: success() || failure()
        run: |
          "$RUNNER_TEMP/grype" tooltrace-web:ci --only-fixed -o json --file grype-web.json
          node scripts/ci/grype-report.mjs grype-web.json "Web image"

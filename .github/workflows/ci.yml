name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI can read the code and nothing else.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API - typecheck, test, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
      # Also runs the shared-rate-limit tests against a real Redis.
      REDIS_TEST_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: scripts/ci/run.sh "API tests" npm test
      - run: npm run build

  ml:
    name: ML - lint and tests (Python)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: ml/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: ../scripts/ci/run.sh "ML tests" python -m pytest

  e2e:
    name: Web - browser tests with real passkeys
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      E2E_DATABASE_URL: postgres://postgres:postgres@localhost:5432/tooltrace_e2e
      NEXT_TELEMETRY_DISABLED: 1
      ML_PYTHON: python
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The journey runs the real nightly ML job against the test database.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - run: pip install -r ml/requirements.txt
      - run: npm run build -w apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: scripts/ci/run.sh "Browser tests" npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: apps/web/test-results
          retention-days: 7

  tour:
    name: Demo tour - recorded video
    # The product tour runs against the stack configured like the public demo (demo mode,
    # API behind the proxy secret) and is re-recorded on every push.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      TOUR_DATABASE_URL: postgres://postgres:postgres@localhost:5432/tooltrace_tour
      NEXT_TELEMETRY_DISABLED: 1
      ML_PYTHON: python
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - run: pip install -r ml/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm run build -w apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: scripts/ci/run.sh "Demo tour" npm run tour -w apps/web
      - uses: actions/upload-artifact@v4
        with:
          name: tooltrace-demo-video
          path: docs/demo/
          retention-days: 30

  firmware:
    name: Firmware - C++ tests and ESP32 build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware/station
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get install -y --no-install-recommends libssl-dev
      - name: Host tests (shared signing vectors)
        run: make -C test/host
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/station/platformio.ini') }}
      - run: pip install platformio
      - run: cp include/config.example.h include/config.h
      - name: Build ESP32 firmware
        run: pio run

  docker:
    name: Docker images - build and CVE scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -f apps/api/Dockerfile -t tooltrace-api:ci .
      - run: docker build -f apps/web/Dockerfile -t tooltrace-web:ci .
      - run: docker build -f ml/Dockerfile -t tooltrace-ml:ci .
      - name: Install Grype (pinned, checksum-verified)
        run: |
          curl -sSfL -o grype.tgz https://github.com/anchore/grype/releases/download/v0.120.1/grype_0.120.1_linux_amd64.tar.gz
          echo "0a9ee97ef5ae2ee953b0a80098105052e846cdbe319a57d808b519c33cd1343d  grype.tgz" | sha256sum -c -
          tar xzf grype.tgz -C "$RUNNER_TEMP" grype
      # Findings become annotations and a job summary. Fails only on critical
      # vulnerabilities that already have a fix (so there is something to do about it).
      - name: Scan API image
        run: |
          scripts/ci/run.sh "Grype (API image)" "$RUNNER_TEMP/grype" tooltrace-api:ci --only-fixed -o json --file grype-api.json
          node scripts/ci/grype-report.mjs grype-api.json "API image"
      - name: Scan web image
        if: success() || failure()
        run: |
          scripts/ci/run.sh "Grype (web image)" "$RUNNER_TEMP/grype" tooltrace-web:ci --only-fixed -o json --file grype-web.json
          node scripts/ci/grype-report.mjs grype-web.json "Web image"
      - name: Scan ML image
        if: success() || failure()
        run: |
          scripts/ci/run.sh "Grype (ML image)" "$RUNNER_TEMP/grype" tooltrace-ml:ci --only-fixed -o json --file grype-ml.json
          node scripts/ci/grype-report.mjs grype-ml.json "ML image"

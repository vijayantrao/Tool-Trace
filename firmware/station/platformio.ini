; ToolTrace smart tool station. Build: pio run    Flash: pio run -t upload
; Before building, copy include/config.example.h to include/config.h and fill it in.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -Wall
lib_deps =
  miguelbalboa/MFRC522@^1.4.11
  knolleary/PubSubClient@^2.8
  bblanchon/ArduinoJson@^7.2.1
  adafruit/Adafruit SSD1306@^2.5.13
  adafruit/Adafruit GFX Library@^1.11.11
